<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mock PokerNow table</title>
<style>
  body{margin:0;background:#1b1e24;color:#eee;font:13px/1.3 system-ui;height:100vh}
  .table-felt{position:absolute;left:120px;top:90px;width:900px;height:440px;border-radius:220px;
    background:radial-gradient(ellipse at center,#2f9e5e,#1f7a46)}
  .table-player{position:absolute;background:#2b3038;border-radius:8px;padding:6px 10px;min-width:150px}
  .table-player-name{font-weight:600}
  .table-player-stack{font-size:16px}
  .table-player-cards{display:flex;gap:3px;margin-bottom:4px}
  .card{width:34px;height:46px;background:#fff;color:#111;border-radius:4px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;font-weight:700}
  .card.back{background:#e46a6a}
  .card .suit{font-size:15px}
  .card.red{color:#d33}
  .table-cards{position:absolute;left:420px;top:270px;display:flex;gap:8px}
  .table-cards .card{width:56px;height:76px;font-size:22px}
  .table-pot-size{position:absolute;left:520px;top:200px;background:#0006;padding:4px 18px;border-radius:14px;font-size:18px}
  .game-decisions-ctn{position:absolute;left:420px;bottom:20px;display:flex;gap:8px}
  .game-decisions-ctn button{padding:10px 22px;font-size:14px}
  .dealer-button-ctn{position:absolute;left:600px;top:420px;width:22px;height:22px;border-radius:50%;
    background:#fff;color:#225;display:flex;align-items:center;justify-content:center;font-weight:800}
  .table-player-bet-value{color:#ffd479;font-size:12px}
  .log-ctn{position:absolute;left:12px;bottom:12px;width:340px;height:230px;background:#12151b;
    border:1px solid #2b3038;border-radius:8px;display:flex;flex-direction:column}
  .log-ctn h4{margin:0;padding:6px 8px;font-size:11px;letter-spacing:.08em;color:#8b98a9;
    border-bottom:1px solid #2b3038}
  .log-entries{flex:1;overflow:auto;padding:4px 8px}
  .log-entry{font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#c4ccd8;padding:1px 0}
  .log-ctn .ctrl{display:flex;gap:6px;padding:6px 8px;border-top:1px solid #2b3038}
  .log-ctn .ctrl button{flex:1;font:11px system-ui;padding:5px}
</style>
</head>
<body>
<div class="table-felt"></div>

<!-- seat 1: folded -->
<div class="table-player table-player-1 fold" style="left:60px;top:200px">
  <div class="table-player-name">Luckyhold'em</div><div class="table-player-stack">179</div>
  <div>FOLD</div>
</div>

<!-- seat 2 -->
<div class="table-player table-player-2" style="left:100px;top:430px">
  <div class="table-player-cards">
    <div class="card-container"><div class="card back">&nbsp;</div></div>
    <div class="card-container"><div class="card back">&nbsp;</div></div>
  </div>
  <div class="table-player-name">Bade N Ji</div><div class="table-player-stack">64</div>
</div>

<!-- seat 3 -->
<div class="table-player table-player-3" style="left:470px;top:560px">
  <div class="table-player-cards">
    <div class="card-container"><div class="card back">&nbsp;</div></div>
    <div class="card-container"><div class="card back">&nbsp;</div></div>
  </div>
  <div class="table-player-name">doggy</div><div class="table-player-stack">234</div>
  <div class="table-player-bet-value">4</div>
</div>

<!-- hero -->
<div class="table-player table-player-4 you-player" style="left:700px;top:560px">
  <div class="table-player-cards">
    <div class="card-container"><div class="card"><div class="value">3</div><div class="suit">♣</div></div></div>
    <div class="card-container"><div class="card red"><div class="value">8</div><div class="suit">♥</div></div></div>
  </div>
  <div class="table-player-name">IBluffOnlyOk</div><div class="table-player-stack">400</div>
  <div class="table-player-bet-value">4</div>
</div>

<!-- seat 5 -->
<div class="table-player table-player-5" style="left:1000px;top:150px">
  <div class="table-player-cards">
    <div class="card-container"><div class="card back">&nbsp;</div></div>
    <div class="card-container"><div class="card back">&nbsp;</div></div>
  </div>
  <div class="table-player-name">bangsix</div><div class="table-player-stack">812</div>
</div>

<!-- seat 6 -->
<div class="table-player table-player-6" style="left:1000px;top:400px">
  <div class="table-player-cards">
    <div class="card-container"><div class="card back">&nbsp;</div></div>
    <div class="card-container"><div class="card back">&nbsp;</div></div>
  </div>
  <div class="table-player-name">JayRazor</div><div class="table-player-stack">190</div>
</div>

<div class="table-pot-size">12</div>

<div class="table-cards">
  <div class="card-container"><div class="card"><div class="value">K</div><div class="suit">♣</div></div></div>
  <div class="card-container"><div class="card red"><div class="value">K</div><div class="suit">♦</div></div></div>
  <div class="card-container"><div class="card red"><div class="value">K</div><div class="suit">♥</div></div></div>
</div>

<div class="dealer-button-ctn dealer-position-3">D</div>

<div class="game-decisions-ctn">
  <button class="button-1">Fold</button>
  <button class="button-2">Call 8</button>
  <button class="button-3">Raise</button>
</div>

<div class="log-ctn">
  <h4>LOG</h4>
  <div class="log-entries"></div>
  <div class="ctrl">
    <button id="step">Next line</button>
    <button id="play">Play hand history</button>
  </div>
</div>

<script src="pokernow-panel.user.js"></script>
<script>
// The same two-hand fixture the Node suite asserts against, replayed into a DOM
// log panel so ingestion, stats and the HUD can be exercised in a browser.
const FIXTURE = [
  `-- starting hand #1  (No Limit Texas Hold'em) (dealer: "Alice @ aaa") --`,
  `Player stacks: #1 "Alice @ aaa" (1000) | #2 "Bob @ bbb" (1000) | #3 "Cara @ ccc" (1000)`,
  `"Bob @ bbb" posts a small blind of 5`,
  `"Cara @ ccc" posts a big blind of 10`,
  `Your hand is A♠, K♦`,
  `"Alice @ aaa" raises to 30`,
  `"Bob @ bbb" folds`,
  `"Cara @ ccc" calls 30`,
  `Flop:  [7♣, 2♦, 9♠]`,
  `"Cara @ ccc" checks`,
  `"Alice @ aaa" bets 40`,
  `"Cara @ ccc" folds`,
  `Uncalled bet of 40 returned to "Alice @ aaa"`,
  `"Alice @ aaa" collected 65 from pot`,
  `-- ending hand #1 --`,
  `-- starting hand #2  (No Limit Texas Hold'em) (dealer: "Bob @ bbb") --`,
  `Player stacks: #1 "Alice @ aaa" (1035) | #2 "Bob @ bbb" (995) | #3 "Cara @ ccc" (970)`,
  `"Cara @ ccc" posts a small blind of 5`,
  `"Alice @ aaa" posts a big blind of 10`,
  `Your hand is 5♥, 5♣`,
  `"Bob @ bbb" calls 10`,
  `"Cara @ ccc" calls 10`,
  `"Alice @ aaa" checks`,
  `Flop:  [5♦, K♠, 2♣]`,
  `"Cara @ ccc" checks`,
  `"Alice @ aaa" bets 20`,
  `"Bob @ bbb" calls 20`,
  `"Cara @ ccc" folds`,
  `Turn: 5♦, K♠, 2♣ [Qh]`,
  `"Alice @ aaa" checks`,
  `"Bob @ bbb" checks`,
  `River: 5♦, K♠, 2♣, Qh [3s]`,
  `"Alice @ aaa" bets 30`,
  `"Bob @ bbb" calls 30 and go all in`,
  `"Bob @ bbb" shows a K♥, K♣.`,
  `"Alice @ aaa" shows a 5♥, 5♣.`,
  `"Alice @ aaa" collected 130 from pot with Three of a Kind`,
  `-- ending hand #2 --`,
];

const entries = document.querySelector('.log-entries');
// ?reverse=1 renders newest-first, to exercise the panel's orientation detection.
const REVERSED = new URLSearchParams(location.search).get('reverse') === '1';
let cursor = 0;

function emit() {
  if (cursor >= FIXTURE.length) return false;
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.textContent = FIXTURE[cursor++];
  if (REVERSED) entries.prepend(div);
  else { entries.appendChild(div); entries.scrollTop = entries.scrollHeight; }
  return true;
}

document.getElementById('step').addEventListener('click', emit);
document.getElementById('play').addEventListener('click', () => {
  const t = setInterval(() => { if (!emit()) clearInterval(t); }, 60);
});
</script>
</body>
</html>
